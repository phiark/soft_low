reference_train:
  reference_id: plan_a_v1_0_softmax_ce_reference
  model_family: softmax_ce_reference
  score_name: softmax_entropy
  score_names:
    - softmax_entropy
    - max_softmax_probability
    - predictive_entropy
    - energy_score
  seed: 7
  epochs: 10
  runtime:
    backend: auto
    dtype: float32
    amp_enabled: false
  dataloader:
    batch_size: 128
    shuffle: true
    drop_last: true
    num_workers: 0
    pin_memory: auto
  inference_dataloader:
    batch_size: 128
    num_workers: 0
    pin_memory: auto
